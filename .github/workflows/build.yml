name: Build

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: ItemBank
          path: target/ItemBank-*.jar
      - name: Attach jar to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" target/ItemBank-*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.21.1"
            java: 21
          - version: "latest-26"
            java: 25
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: ItemBank
          path: plugin
      - name: Start Purpur and load the plugin
        run: |
          v="${{ matrix.version }}"
          if [ "$v" = "latest-26" ]; then
            v=$(curl -s https://api.purpurmc.org/v2/purpur | jq -r '.versions[]' | grep '^26\.' | sort -V | tail -1)
          fi
          echo "Testing on Purpur $v"
          mkdir -p server/plugins && cd server
          curl -sL -o server.jar "https://api.purpurmc.org/v2/purpur/$v/latest/download"
          cp ../plugin/*.jar plugins/
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties

          mkfifo console
          (java -Xmx2G -jar server.jar --nogui < console > out.log 2>&1; echo "exit $?" >> out.log) &
          exec 3>console

          for i in $(seq 1 240); do grep -q 'Done (' out.log && break; sleep 1; done
          grep -q 'Done (' out.log || { cat out.log; exit 1; }

          echo "ibank prices" >&3
          echo "ibank update" >&3
          sleep 3
          echo "stop" >&3
          for i in $(seq 1 60); do grep -q '^exit' out.log && break; sleep 1; done
          cat out.log

          grep -q 'Enabling ItemBank' out.log
          grep -q "No money plugin found" out.log
          grep -q 'Item Bank prices' out.log
          grep -q 'Iron Ingot' out.log
          grep -q 'Daily update done' out.log
          ! grep -E 'Error occurred while enabling ItemBank|Could not load .*ItemBank|Exception.*itembank|NoClassDefFound' out.log
